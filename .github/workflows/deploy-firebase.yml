name: Deploy web app to Firebase Hosting

# Builds the React app and publishes it to Firebase Hosting on every push to
# main. Everything runs on GitHub's machines, so nothing has to be installed
# locally.
#
# Required repository secret (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT   full JSON of a service account holding the
#                              "Firebase Hosting Admin" role
#
# The Firebase web config (apiKey / authDomain / projectId) is public by design
# and lives in src/lib/firebase.js — it is not a credential and needs no secret.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui_react_tailwind/package-lock.json

      - name: Install dependencies
        working-directory: ui_react_tailwind
        run: npm ci

      - name: Run rule tests
        working-directory: ui_react_tailwind
        run: npm test

      - name: Build
        working-directory: ui_react_tailwind
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: table-93579
          channelId: live
